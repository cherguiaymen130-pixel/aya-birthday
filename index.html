<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffe4ee" />
<title>Happy Birthday 💕</title>

<!-- ============================================================
     GOOGLE FONTS (only external dependency allowed)
     - Great Vibes  : the elegant script title
     - Dancing Script: the typewriter personal message
     - Poppins      : the plain UI font (button, tiny labels)
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />

<style>
/* ============================================================
   0. DESIGN TOKENS  — tweak colours / sizes in ONE place
   ============================================================ */
:root{
  /* background gradient stops (blush pink -> lavender, very subtle) */
  --bg-1:#fff7fb;
  --bg-2:#ffe3ec;   /* blush pink */
  --bg-3:#f4e6ff;
  --bg-4:#e7e1ff;   /* lavender   */

  /* accent colours */
  --pink:#ff6f9c;
  --pink-soft:#ff9ec4;
  --gold:#ffdca8;
  --ink:#6d4359;      /* body text */
  --ink-soft:#a1798d; /* caret / smoke */

  /* geometry */
  --heart-font: clamp(11px, 2.6vw, 15px); /* fallback particle size */
  --radius-pill: 999px;
  --tap: 48px;        /* minimum touch target size */
}

/* ============================================================
   1. BASE / RESET
   ============================================================ */
*,*::before,*::after{ box-sizing:border-box; }

html,body{
  height:100%;
  margin:0;
  overflow:hidden;                 /* the whole thing is a fixed-size stage */
  overscroll-behavior:none;        /* no pull-to-refresh on mobile */
}

body{
  font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(120% 90% at 15% 0%,  rgba(255,255,255,.85) 0%, rgba(255,255,255,0) 55%),
    radial-gradient(100% 80% at 85% 100%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 60%),
    linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 38%, var(--bg-3) 74%, var(--bg-4) 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;       /* removes the 300ms tap delay */
  user-select:none;
}

/* Every visual layer is a full-screen, non-scrolling, click-through box. */
.layer{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;             /* children opt back in individually */
  contain:strict;                  /* perf: isolate paint/layout of the layer */
}

/* z-order of the whole experience (keep them together for clarity) */
.layer--confetti{ z-index:1; }/* scene 3 confetti rain (background) */
.layer--stage{ z-index:2; }   /* the emoji-heart particle swarm      */
.layer--finale{ z-index:4; }  /* cake + wish + replay               */
.layer--scene1{ z-index:5; }  /* scene 1 button overlay (top)       */

/* ============================================================
   2. SCENE 1 — floating hearts in the background + big button
   ============================================================ */
.scene1{
  display:grid;
  place-items:center;                       /* button always dead-centre */
  padding:24px;
  pointer-events:auto;                      /* needs clicks while visible */
  transition:opacity .6s ease, visibility .6s ease;
}
.scene1.is-hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
/* while the button is gone, freeze the drifting hearts (saves battery) */
.scene1.is-hidden .float-heart{ animation-play-state:paused; }

/* tiny drifting heart particle (scene 1 background, reused nowhere else) */
.float-heart{
  position:absolute;
  top:0; left:0;
  line-height:1;
  opacity:0;
  will-change:transform,opacity;
  animation-name:floatDrift;
  animation-timing-function:linear;
  animation-iteration-count:infinite;
}
@keyframes floatDrift{
  0%   { transform:translate3d(0, 12vh, 0) scale(.85);      opacity:0;    }
  12%  {                                                    opacity:var(--o,.28); }
  88%  {                                                    opacity:var(--o,.28); }
  100% { transform:translate3d(var(--dx,20px), -112vh, 0) scale(1.1); opacity:0; }
}
/* --- the "click me 💗" button ------------------------------ */
.magic-btn{
  /* touch friendly: never smaller than 48px in either direction */
  min-height:var(--tap);
  min-width:220px;
  padding:16px 34px;
  border:0;
  border-radius:var(--radius-pill);
  font-family:inherit;
  font-size:clamp(19px,4.6vw,26px);
  font-weight:500;
  letter-spacing:.02em;
  color:#fff;
  cursor:pointer;
  background:linear-gradient(135deg,#ffb0cd 0%,var(--pink) 52%,#ff8fb8 100%);
  box-shadow:
    0 12px 30px rgba(255,111,156,.38),
    0 2px 6px rgba(255,111,156,.28),
    inset 0 0 0 1px rgba(255,255,255,.55);
  /* two independent animations: one moves (scale), one glows (box-shadow) */
  animation:btnBreathe 2.8s ease-in-out infinite, btnGlow 2.8s ease-in-out infinite;
  transition:transform .5s cubic-bezier(.22,.68,.3,1),
             opacity .5s ease,
             filter .5s ease,
             box-shadow .2s ease;
  -webkit-user-select:none;
  user-select:none;
}
.magic-btn__label{ display:block; transform:translateZ(0); }

@keyframes btnBreathe{
  0%,100%{ transform:scale(1) translateZ(0); }
  50%    { transform:scale(1.055) translateZ(0); }
}
@keyframes btnGlow{
  0%,100%{
    box-shadow:0 12px 30px rgba(255,111,156,.34),
               0 0 0 0 rgba(255,140,180,.42),
               inset 0 0 0 1px rgba(255,255,255,.55);
  }
  50%{
    box-shadow:0 16px 40px rgba(255,111,156,.46),
               0 0 0 22px rgba(255,140,180,0),
               inset 0 0 0 1px rgba(255,255,255,.7);
  }
}
/* tactile feedback (paint-only, so it can't fight the animations) */
.magic-btn:active{ filter:brightness(1.07) saturate(1.05); }
.magic-btn:focus-visible{ outline:3px solid rgba(255,111,156,.6); outline-offset:4px; }

/* --- the button "dissolving" into hearts ------------------- */
.magic-btn.is-dissolving{
  animation:none;                                 /* stop breathing first  */
  transform:scale(1.42) translateZ(0);
  opacity:0;
  filter:blur(9px);
  pointer-events:none;
}
/* ============================================================
   3. SCENE 2 — the swarm: hundreds of emoji hearts -> ONE heart
   ============================================================ */

/* a single flying emoji heart. Positioned at 0/0 and moved ONLY with
   transform, so the browser never has to re-layout anything. */
.particle{
  position:absolute;
  top:0; left:0;
  width:1em; height:1em;
  text-align:center;
  line-height:1;
  will-change:transform;
  opacity:0;                       /* fades in as it launches */
  pointer-events:none;
  backface-visibility:hidden;
  contain:layout style;            /* perf: keep each particle self-contained */
  transition:opacity .2s ease;     /* soft pop-in when it launches */
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
.particle.is-live{ opacity:1; }

/* soft aura behind the finished heart (CSS-only, no per-frame work) */
.heart-glow{
  position:absolute;
  top:0; left:0;
  border-radius:50%;
  opacity:0;
  transform:translate3d(-50%,-50%,0) scale(.7);
  background:radial-gradient(circle at 50% 50%,
              rgba(255,130,175,.55) 0%,
              rgba(255,170,205,.28) 42%,
              rgba(255,210,180,.12) 62%,
              rgba(255,255,255,0)   72%);
  transition:opacity 1.1s ease, transform 1.1s cubic-bezier(.2,.7,.25,1);
  will-change:opacity,transform;
  pointer-events:none;
}
.heart-glow.is-on{
  opacity:1;
  transform:translate3d(-50%,-50%,0) scale(1);
  animation:glowPulse 5s ease-in-out infinite 1.2s;
}
@keyframes glowPulse{
  0%,100%{ opacity:.82; }
  50%    { opacity:1;   }
}

/* a few small hearts orbiting the finished big heart.
   .orbit is a zero-size point placed on the heart's centre by JS. */
.orbit{
  position:fixed;
  top:0; left:0;
  width:0; height:0;
}
.orbit__item{
  position:absolute;
  top:0; left:0;
  line-height:1;
  will-change:transform;
  animation-name:orbit;
  animation-timing-function:linear;
  animation-iteration-count:infinite;
}
@keyframes orbit{
  from{ transform:rotate(var(--a)) translateX(var(--r)) rotate(calc(var(--a) * -1)); }
  to  { transform:rotate(calc(var(--a) + 360deg)) translateX(var(--r)) rotate(calc((var(--a) + 360deg) * -1)); }
}

/* --- "Happy Birthday, Aya 💕" (gradient + shimmer + reveal) ---- */
.title-wrap{
  position:fixed;
  left:0; right:0;
  top:40%;                         /* JS repositions this after layout calc */
  display:flex;
  justify-content:center;
  align-items:baseline;
  gap:.16em;
  padding:0 12px;
  z-index:3;
  pointer-events:none;
  opacity:0;
  transition:opacity .8s ease;
}
.title-wrap.is-visible{ opacity:1; }

.title{
  display:inline-block;
  margin:0;
  font-family:"Great Vibes","Dancing Script",cursive;
  font-weight:400;
  /* clamp()-ed with a vh cap so landscape phones never lose the layout */
  font-size:clamp(34px, min(11vw, 17vh), 110px);
  line-height:1.06;
  letter-spacing:.01em;
  white-space:nowrap;
  /* pink -> gold gradient painted INSIDE the glyphs */
  background-image:linear-gradient(100deg,
      #ff4f86 0%, #ff8fb8 22%, #ffd79a 45%, #ffe9c4 55%, #ff9ec4 74%, #ff4f86 100%);
  background-size:280% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 14px rgba(255,120,165,.35));
  animation:shimmerSweep 7s linear infinite;
}
@keyframes shimmerSweep{
  from{ background-position:0% 50%; }
  to  { background-position:280% 50%; }
}
/* the emoji lives OUTSIDE the gradient clip so it keeps its real colours */
.title__emoji{
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  font-size:clamp(28px, min(8.4vw, 13vh), 84px);
  line-height:1;
  -webkit-text-fill-color:initial;
  color:initial;
  background:none;
  opacity:0;
  transform:translate3d(0,14px,0) scale(.6);
  transition:opacity .5s ease, transform .6s cubic-bezier(.2,1.5,.4,1);
}
.title-wrap.is-visible .title__emoji{ opacity:1; transform:translate3d(0,0,0) scale(1); }

/* one letter of the title. The animation only starts once JS adds
   .is-revealing, so nothing shows up before the heart is formed.
   JS sets --i for the stagger delay. */
.letter{
  display:inline-block;
  opacity:0;
  transform:translate3d(0,.55em,0) rotate(6deg) scale(.86);
}
.title__text.is-revealing .letter{
  animation:letterIn .85s cubic-bezier(.2,1.1,.3,1) forwards;
  animation-delay:calc(var(--i,0) * 55ms);
}
.letter--space{ width:.22em; }
@keyframes letterIn{
  to{ opacity:1; transform:translate3d(0,0,0) rotate(0) scale(1); }
}

/* --- the personal message (typewriter) ------------------------- */
.msg-wrap{
  position:fixed;
  left:0; right:0;
  top:60%;                         /* JS repositions this after layout calc */
  display:flex;
  justify-content:center;
  padding:0 22px;
  z-index:3;
  pointer-events:none;
  opacity:0;
  transition:opacity .7s ease;
}
.msg-wrap.is-visible{ opacity:1; }
.msg{
  margin:0;
  max-width:26ch;
  text-align:center;
  font-family:"Dancing Script",cursive;
  font-weight:500;
  font-size:clamp(17px, min(4.6vw, 3.6vh), 30px);
  line-height:1.35;
  color:var(--ink);
  text-shadow:0 1px 10px rgba(255,255,255,.75);
}
.caret{
  display:inline-block;
  width:.09em;
  height:1.05em;
  margin-left:.06em;
  vertical-align:-.16em;
  border-radius:1px;
  background:var(--pink);
  animation:caretBlink 1s steps(1,end) infinite;
}
.caret.is-done{ animation:none; opacity:0; transition:opacity .5s ease; }
@keyframes caretBlink{ 0%,49%{ opacity:1; } 50%,100%{ opacity:0; } }

/* ============================================================
   4. SCENE 3 — the finale (confetti, cake, wish, replay)
   ============================================================ */

/* gently raining confetti hearts (CSS animation = zero JS per frame) */
.confetti{
  position:absolute;
  top:-10vh;
  line-height:1;
  opacity:0;
  will-change:transform,opacity;
  animation-name:confettiFall;
  animation-timing-function:linear;
  animation-iteration-count:infinite;
}
@keyframes confettiFall{
  0%   { transform:translate3d(0,-10vh,0) rotate(-12deg); opacity:0; }
  10%  {                                                  opacity:var(--o,.3); }
  90%  {                                                  opacity:var(--o,.3); }
  100% { transform:translate3d(var(--drift,-30px), 112vh, 0) rotate(320deg); opacity:0; }
}

/* ---------------- the mini birthday cake ---------------------- */
.finale{
  position:fixed;
  left:0; right:0;
  bottom:calc(4vh + env(safe-area-inset-bottom, 0px));
  display:grid;
  justify-items:center;
  z-index:4;
  pointer-events:none;             /* only the cake itself is clickable */
}

/* the cake is a <button>: 150px square-ish => way past the 48px tap target */
.cake{
  position:relative;
  width:150px;
  height:152px;
  padding:0;
  border:0;
  background:none;
  cursor:pointer;
  pointer-events:none;             /* enabled when the finale appears */
  opacity:0;
  transform:translate3d(0,26px,0) scale(.5);
  transform-origin:50% 100%;
  transition:opacity .7s ease, transform .9s cubic-bezier(.2,1.35,.35,1);
  will-change:transform,opacity;
}
.finale.is-visible .cake{
  opacity:1;
  transform:translate3d(0,0,0) scale(1);
  pointer-events:auto;
}
.cake:focus-visible{ outline:3px solid rgba(255,111,156,.55); outline-offset:6px; border-radius:18px; }

/* plate */
.cake__plate{
  position:absolute;
  left:0; bottom:0;
  width:150px; height:12px;
  border-radius:50%;
  background:linear-gradient(180deg,#ffffff,#e8e0f5);
  box-shadow:0 8px 16px rgba(150,110,150,.22);
}
/* sponge tiers */
.cake__tier{
  position:absolute;
  left:50%;
  border-radius:8px 8px 7px 7px;
  transform:translateX(-50%);
}
.cake__tier--bottom{
  bottom:11px; width:118px; height:48px;
  background:linear-gradient(180deg,#ffc9dc 0%,#ffb0c9 46%,#f79bb8 100%);
  box-shadow:inset 0 -6px 10px rgba(190,110,145,.25), 0 6px 12px rgba(180,120,150,.18);
}
.cake__tier--top{
  bottom:57px; width:92px; height:34px;
  background:linear-gradient(180deg,#ffe0ec 0%,#ffc6da 50%,#ffb1ca 100%);
  box-shadow:inset 0 -5px 9px rgba(190,110,145,.2), 0 5px 10px rgba(180,120,150,.16);
}
/* creamy frosting band with a scalloped bottom edge (pure gradient) */
.cake__tier::before{
  content:"";
  position:absolute;
  left:0; right:0; top:0;
  height:14px;
  border-radius:8px 8px 0 0;
  background-color:#fffafc;
  background-image:radial-gradient(circle at 7px 8px, #fffafc 6px, rgba(255,250,252,0) 6.6px);
  background-size:14px 14px;
  background-repeat:repeat-x;
  background-position:bottom left;
  box-shadow:0 2px 4px rgba(210,160,190,.25);
}
/* candles */
.cake__candles{ position:absolute; left:0; right:0; bottom:89px; height:40px; }
.candle{
  position:absolute;
  bottom:0;
  width:9px; height:34px;
  border-radius:4px 4px 2px 2px;
  background:repeating-linear-gradient(48deg,#ffffff 0 4px,#ff9ec4 4px 8px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);
  transform:translateX(-50%);
}
.candle:nth-child(1){ left:34px; }
.candle:nth-child(2){ left:75px; }
.candle:nth-child(3){ left:116px; }
/* thin wick */
.candle::after{
  content:"";
  position:absolute;
  left:50%; top:-5px;
  width:2px; height:6px;
  margin-left:-1px;
  border-radius:1px;
  background:#7b5a68;
}
/* the flame */
.flame{
  position:absolute;
  left:50%; bottom:36px;
  width:13px; height:19px;
  margin-left:-6.5px;
  border-radius:50% 50% 50% 50% / 68% 68% 32% 32%;
  background:radial-gradient(ellipse at 50% 72%,
      #fffdf2 0%, #ffe38a 32%, #ffb347 62%, #ff7a3d 100%);
  box-shadow:0 0 12px 3px rgba(255,186,92,.75), 0 0 34px 10px rgba(255,170,90,.28);
  transform-origin:50% 100%;
  animation:flicker 1.5s ease-in-out infinite;
}
.candle:nth-child(2) .flame{ animation-duration:1.15s; animation-delay:-.35s; }
.candle:nth-child(3) .flame{ animation-duration:1.7s;  animation-delay:-.7s;  }
@keyframes flicker{
  0%,100%{ transform:scale(1,1) translate3d(0,0,0) rotate(-1.5deg); opacity:1; }
  25%    { transform:scale(1.08,.94) translate3d(0,-1px,0) rotate(2deg); opacity:.94; }
  50%    { transform:scale(.93,1.09) translate3d(0,-2px,0) rotate(-2.4deg); opacity:1; }
  75%    { transform:scale(1.05,.97) translate3d(0,-1px,0) rotate(1.4deg); opacity:.9; }
}
/* blown out: flames shrink & die away */
.cake.is-blown .flame{
  animation:none;
  opacity:0;
  transform:scale(.15,.4) translate3d(0,-6px,0);
  box-shadow:none;
  transition:opacity .45s ease, transform .45s ease, box-shadow .6s ease;
}
/* thin smoke wisps (2 per candle) rising after the blow-out */
.smoke{
  position:absolute;
  left:50%; bottom:36px;
  width:7px; height:7px;
  margin-left:-3.5px;
  border-radius:50%;
  background:radial-gradient(circle at 50% 50%, rgba(190,178,190,.75), rgba(190,178,190,0) 70%);
  opacity:0;
  transform:translate3d(0,0,0) scale(.4);
}
.cake.is-blown .smoke{ animation:smokeRise 2.4s ease-out forwards; }
.cake.is-blown .smoke--b{ animation-delay:.28s; animation-duration:2.9s; }
@keyframes smokeRise{
  0%  { opacity:0;   transform:translate3d(0,0,0) scale(.4);          }
  18% { opacity:.7;  transform:translate3d(2px,-14px,0) scale(.85);   }
  60% { opacity:.42; transform:translate3d(-4px,-52px,0) scale(1.35); }
  100%{ opacity:0;   transform:translate3d(6px,-96px,0) scale(1.9);   }
}

/* ---------------- "Make a wish 🌟" popup ---------------------- */
.wish{
  position:absolute;
  bottom:170px;
  padding:12px 22px;
  border-radius:var(--radius-pill);
  background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(255,236,244,.96));
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 10px 26px rgba(190,120,160,.28);
  font-size:clamp(15px,4vw,19px);
  font-weight:600;
  color:#c2477c;
  white-space:nowrap;
  opacity:0;
  transform:translate3d(0,10px,0) scale(.6);
  transition:opacity .45s ease, transform .55s cubic-bezier(.2,1.5,.35,1);
  pointer-events:none;
}
.wish.is-visible{ opacity:1; transform:translate3d(0,0,0) scale(1); }

/* ---------------- replay button -------------------------------- */
.replay{
  position:fixed;
  right:calc(14px + env(safe-area-inset-right, 0px));
  bottom:calc(14px + env(safe-area-inset-bottom, 0px));
  z-index:6;
  min-height:var(--tap);
  min-width:var(--tap);
  padding:12px 18px;
  border:1px solid rgba(255,255,255,.8);
  border-radius:var(--radius-pill);
  font-family:inherit;
  font-size:15px;
  font-weight:500;
  color:#c2477c;
  background:rgba(255,255,255,.78);
  box-shadow:0 8px 20px rgba(190,120,160,.22);
  cursor:pointer;
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  opacity:0;
  transform:translate3d(0,12px,0);
  transition:opacity .5s ease, transform .5s cubic-bezier(.2,1.2,.4,1), background .2s ease;
  pointer-events:none;
}
.replay.is-visible{ opacity:1; transform:translate3d(0,0,0); pointer-events:auto; }
.replay:active{ background:rgba(255,255,255,.95); }
.replay:focus-visible{ outline:3px solid rgba(255,111,156,.55); outline-offset:3px; }
/* ---------------- landscape phones: park the cake in the corner ----- */
body.is-landscape .finale{
  left:auto;
  right:calc(6px + env(safe-area-inset-right, 0px));
  bottom:calc(2vh + env(safe-area-inset-bottom, 0px));
  justify-items:end;
  transform:scale(.68);
  transform-origin:100% 100%;
}
body.is-landscape .wish{ bottom:148px; right:0; }
body.is-landscape .replay{
  top:calc(10px + env(safe-area-inset-top, 0px));
  bottom:auto;
  right:calc(10px + env(safe-area-inset-right, 0px));
}

/* ============================================================
   5. ACCESSIBILITY — prefers-reduced-motion
   All decorative loops stop; JS also skips the swarm animation
   and shows the finished heart + text immediately.
   ============================================================ */
@media (prefers-reduced-motion: reduce){
  .float-heart,
  .confetti,
  .orbit__item,
  .flame,
  .heart-glow.is-on,
  .title{ animation:none !important; }

  .float-heart,
  .confetti{ display:none; }              /* no drifting/falling background */

  .magic-btn{ animation:none; }

  /* letters are revealed instantly, no stagger */
  .letter,
  .title__text.is-revealing .letter{ animation:none !important; opacity:1; transform:none; }
  .title__emoji{ transition:none; }
  .title-wrap,
  .msg-wrap{ transition:none; }

  .cake{ transition:opacity .3s ease; }
  .wish{ transition:opacity .3s ease; }
  .replay{ transition:opacity .3s ease; }
}

</style>
</head>
<body>
<!-- ============================================================
     The whole experience lives in stacked, fixed, click-through layers.
     LAYER 1 (background confetti)  ->  LAYER 2 (particle stage)
     -> LAYER 3 (title + message)   ->  LAYER 4 (finale)
     -> LAYER 5 (scene 1 button on top)
     ============================================================ -->

<!-- confetti rain for the finale (filled by JS) -->
<div id="confettiLayer" class="layer layer--confetti" aria-hidden="true"></div>

<!-- the particle swarm stage: tiny emoji hearts become ONE big heart -->
<div id="stage" class="layer layer--stage" aria-hidden="true">
  <div id="heartGlow" class="heart-glow"></div>
  <div id="orbitLayer" class="orbit"></div>
</div>

<!-- title + personal message -->
<div id="titleWrap" class="title-wrap">
  <h1 class="title"><span id="titleText" class="title__text"></span><span class="title__emoji">💕</span></h1>
</div>
<div id="msgWrap" class="msg-wrap">
  <p class="msg"><span id="typed"></span><span id="caret" class="caret"></span></p>
</div>

<!-- finale: cake + wish popup + replay.
     The cake is drawn with pure CSS so the candles can really flicker and
     smoke. Prefer the plain emoji instead? Replace everything inside the
     button with a single <span style="font-size:96px">🎂</span>. -->
<div id="finale" class="finale">
  <div id="wish" class="wish" role="status" aria-live="polite">Make a wish 🌟</div>
  <button id="cake" class="cake" type="button" aria-label="Tap the cake to blow out the candles">
    <span class="cake__plate"></span>
    <span class="cake__tier cake__tier--bottom"></span>
    <span class="cake__tier cake__tier--top"></span>
    <span class="cake__candles">
      <span class="candle"><span class="flame"></span><span class="smoke"></span><span class="smoke smoke--b"></span></span>
      <span class="candle"><span class="flame"></span><span class="smoke"></span><span class="smoke smoke--b"></span></span>
      <span class="candle"><span class="flame"></span><span class="smoke"></span><span class="smoke smoke--b"></span></span>
    </span>
  </button>
</div>
<button id="replay" class="replay" type="button">replay ↺</button>

<!-- scene 1: drifting hearts + the big button -->
<section id="scene1" class="layer layer--scene1 scene1">
  <button id="magicBtn" class="magic-btn" type="button">
    <span class="magic-btn__label">click me 💗</span>
  </button>
</section>
<script>
/* ============================================================
   ✏️  CUSTOMIZATION — the only two lines you ever need to touch
   ============================================================ */
const HER_NAME = "Aya";
const PERSONAL_MESSAGE = "You make every day brighter. I love you.";

/* the big script title. The trailing 💕 lives outside the gradient
   clip (see the HTML) so the emoji keeps its real colours.        */
const TITLE_TEXT = "Happy Birthday, " + HER_NAME;

/* ============================================================
   🎛️  TUNING — every magic number of the animation, in one place
   ============================================================ */
const TUNING = {
  /* ---- how many hearts fly (performance vs. wow) ---- */
  heartsDesktop: 500,          // ~500 on a desktop / laptop
  heartsMobile: 200,           // ~200 on a phone
  smallScreen: 700,            // min(innerWidth, innerHeight) below this = "mobile"
  emojis: ["💗", "💖", "💓", "💕", "💞"],

  /* ---- the swarm ---- */
  burstMs: 420,                // how long the initial "explosion" lasts
  burstSpeed: [130, 430],      // px travelled during that burst
  swarmMs: [900, 1800],        // flight time from button to its slot
  staggerMs: 2.2,              // per-particle launch delay (keeps it alive)
  staggerJitterMs: 280,        // extra random delay
  curveAmount: [0.04, 0.22],   // how much each path bows sideways
  particleSize: [11, 18],      // px font-size of each flying heart
  outlineRatio: 0.55,          // share of hearts placed ON the outline
  shimmerAmp: [0.04, 0.11],    // settled-heart shimmer strength
  shimmerSpeed: 0.0016,        // shimmer speed (rad per ms)

  /* ---- reveal choreography (ms) ---- */
  buttonDissolveMs: 620,
  titleDelayMs: 180,
  letterStaggerMs: 55,         // keep in sync with --i * 55ms in the CSS
  typeSpeedMs: 42,             // typewriter speed, per character
  finaleDelayMs: 900,

  /* ---- decorations ---- */
  floatHeartCount: 22,         // scene 1 background drifters
  confettiCount: 26,           // finale background rain
  orbitHeartCount: 7,          // small hearts orbiting the big one
  finalBurst: 70               // hearts released when the candles go out
};

/* ============================================================
   🔎  DOM SHORTCUTS
   ============================================================ */
const dom = {
  scene1:    document.getElementById("scene1"),
  magicBtn:  document.getElementById("magicBtn"),
  stage:     document.getElementById("stage"),
  heartGlow: document.getElementById("heartGlow"),
  orbit:     document.getElementById("orbitLayer"),
  titleWrap: document.getElementById("titleWrap"),
  title:     document.querySelector(".title"),
  titleText: document.getElementById("titleText"),
  titleEmoji:document.querySelector(".title__emoji"),
  msgWrap:   document.getElementById("msgWrap"),
  typed:     document.getElementById("typed"),
  caret:     document.getElementById("caret"),
  finale:    document.getElementById("finale"),
  cake:      document.getElementById("cake"),
  wish:      document.getElementById("wish"),
  replay:    document.getElementById("replay"),
  confetti:  document.getElementById("confettiLayer")
};

/* ============================================================
   🧰  TINY HELPERS
   ============================================================ */
const rand    = (a, b) => a + Math.random() * (b - a);
const pick    = (arr)  => arr[(Math.random() * arr.length) | 0];
const clamp   = (v, a, b) => (v < a ? a : v > b ? b : v);
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeOutBack  = (t, s = 1.6) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);

/* every timer goes through here so "replay ↺" can wipe the slate clean */
const timers = [];
function later(fn, ms) { const id = setTimeout(fn, ms); timers.push(id); return id; }
function clearTimers() { while (timers.length) clearTimeout(timers.pop()); }

/* ============================================================
   🧠  STATE
   ============================================================ */
const mqReduce = window.matchMedia("(prefers-reduced-motion: reduce)");
const state = {
  reduceMotion: mqReduce.matches, // respect the OS setting
  particles: [],      // the swarm (emoji hearts -> big heart)
  freeHearts: [],     // short-lived burst hearts (cake blow-out)
  rafId: 0,
  running: false,
  frame: 0,
  t0: 0,              // swarm start timestamp
  pending: 0,         // particles that have not reached their slot yet
  layout: null,       // geometry computed in computeLayout()
  phase: "idle",      // idle | swarm | formed | finale
  confettiStarted: false
};
mqReduce.addEventListener("change", (e) => { state.reduceMotion = e.matches; });

/* ============================================================
   💗  THE HEART SHAPE
   Classic parametric heart:
     x = 16 sin³t
     y = 13 cos t − 5 cos 2t − 2 cos 3t − cos 4t
   ============================================================ */
function heartXY(t) {
  const s = Math.sin(t);
  return {
    x: 16 * s * s * s,
    y: 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)
  };
}

/* Measured bounds of that curve (sampled once) so the shape can be
   scaled to fit ANY screen instead of relying on guessed numbers. */
const HEART_BOUNDS = (function () {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (let i = 0; i <= 720; i++) {
    const p = heartXY((i / 720) * Math.PI * 2);
    if (p.x < minX) minX = p.x;
    if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.y > maxY) maxY = p.y;
  }
  return {
    w: maxX - minX, h: maxY - minY,
    mx: (minX + maxX) / 2, my: (minY + maxY) / 2
  };
})();

/* Pick ONE slot on the big heart. Scaling the curve by r (0..1) from its
   centre stays inside the shape, so r makes a nice filled heart:
   r ≈ 1 -> crisp outline, r < 1 -> interior. */
function heartSlot(scale, cx, cy) {
  const onOutline = Math.random() < TUNING.outlineRatio;
  const p = heartXY(Math.random() * Math.PI * 2);
  /* r ≈ 1 sits on the outline (a hair inside/outside = fluffy edge),
     r < 1 fills the interior. The power keeps the inside from clumping
     in the middle. */
  const r = onOutline ? rand(0.93, 1.01) : Math.pow(Math.random(), 0.42);
  return {
    x: cx + (p.x * r - HEART_BOUNDS.mx) * scale,
    y: cy - (p.y * r - HEART_BOUNDS.my) * scale   // screen Y grows downwards
  };
}

/* ============================================================
   📐  LAYOUT — where the heart, title, message and cake live
   (computed on load / resize — never per animation frame)
   ============================================================ */
function computeLayout() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const isSmall = Math.min(vw, vh) < TUNING.smallScreen;
  const landscape = vw > vh && vh < 560;   // phone turned sideways

  /* real measured text heights: the nodes are laid out, just transparent */
  const titleH = dom.titleWrap.getBoundingClientRect().height || 44;
  const msgH   = dom.msgWrap.getBoundingClientRect().height || 44;

  const topPad  = vh * 0.055;
  const gap1    = vh * 0.02;
  const gap2    = vh * 0.022;
  /* reserve room at the bottom for the cake (it is on the side in landscape) */
  const cakeSpace = landscape ? vh * 0.05 : clamp(vh * 0.24, 130, 215);
  const textBlock = gap1 + titleH + gap2 + msgH;
  const avail     = vh - topPad - cakeSpace;

  const maxW = vw * (isSmall ? 0.86 : 0.6);
  const airFactor = isSmall ? 0.62 : 0.70;   // how much of the free space the heart takes
  const k = Math.max(2, Math.min(
    maxW / HEART_BOUNDS.w,                  // never wider than the screen
    (avail * airFactor) / HEART_BOUNDS.h,   // keep the big heart airy
    (avail - textBlock) / HEART_BOUNDS.h    // always leave room for the text
  ));

  const heartW = HEART_BOUNDS.w * k;
  const heartH = HEART_BOUNDS.h * k;
  const stackH = heartH + textBlock;
  const y0 = Math.max(topPad * 0.5, topPad + (avail - stackH) / 2);

  return {
    vw, vh, isSmall, landscape, k, heartW, heartH,
    cx: vw / 2,
    cy: y0 + heartH / 2,
    titleTop: y0 + heartH + gap1,
    msgTop: y0 + heartH + gap1 + titleH + gap2
  };
}

/* Compute the layout with the message temporarily FULL-LENGTH, so the space
   we reserve matches the finished text (the typewriter grows into it and
   nothing ever jumps). Restores whatever was on screen afterwards. */
function measureLayout() {
  const current = dom.typed.textContent;
  const needsFill = current !== PERSONAL_MESSAGE;
  if (needsFill) dom.typed.textContent = PERSONAL_MESSAGE;
  const L = computeLayout();               // reads rects => forces layout once
  if (needsFill) dom.typed.textContent = current;
  return L;
}

/* Shrink the title only if the script font would overflow the screen. */
function fitTitle(L) {
  dom.title.style.fontSize = "";                    // back to the CSS clamp()
  const available = L.vw - 28;
  const w = dom.title.scrollWidth || 0;
  if (w > available) {
    const base = parseFloat(getComputedStyle(dom.title).fontSize) || 40;
    dom.title.style.fontSize = Math.max(22, (base * available) / w).toFixed(1) + "px";
  }
  const px = parseFloat(getComputedStyle(dom.title).fontSize) || 40;
  dom.titleEmoji.style.fontSize = (px * 0.78).toFixed(1) + "px";
}

/* Push the computed geometry into the DOM (cheap: no sizes change). */
function applyLayout(L) {
  document.body.classList.toggle("is-landscape", !!L.landscape);
  dom.titleWrap.style.top = L.titleTop + "px";
  dom.msgWrap.style.top = L.msgTop + "px";
  fitTitle(L);

  const glow = L.heartW * 1.8;
  dom.heartGlow.style.width = glow.toFixed(0) + "px";
  dom.heartGlow.style.height = glow.toFixed(0) + "px";
  dom.heartGlow.style.left = L.cx.toFixed(1) + "px";
  dom.heartGlow.style.top = L.cy.toFixed(1) + "px";

  const r = (L.heartW * 0.62).toFixed(1) + "px";
  dom.orbit.style.left = L.cx.toFixed(1) + "px";
  dom.orbit.style.top = L.cy.toFixed(1) + "px";
  dom.orbit.querySelectorAll(".orbit__item").forEach((el) => {
    el.style.setProperty("--r", r);
  });
}

/* ============================================================
   ✍️  THE TITLE (letters appear one by one)
   ============================================================ */
function buildTitle() {
  dom.titleText.innerHTML = "";
  const frag = document.createDocumentFragment();
  const chars = TITLE_TEXT.split("");
  for (let i = 0; i < chars.length; i++) {
    const ch = chars[i];
    const span = document.createElement("span");
    span.className = "letter" + (ch === " " ? " letter--space" : "");
    span.style.setProperty("--i", i);              // CSS stagger delay
    span.textContent = ch === " " ? "\u00A0" : ch;
    frag.appendChild(span);
  }
  dom.titleText.appendChild(frag);
}
function revealTitle() {
  dom.titleText.classList.add("is-revealing");
  dom.titleWrap.classList.add("is-visible");
}
/* ============================================================
     THE SWARM — hundreds of emoji hearts fly into one big heart
   Everything is animated with CSS transforms only (no layout work),
   driven by ONE requestAnimationFrame loop.
   ============================================================ */

/* Write the particle transform. Particles sit at top:0/left:0, so the
   -size/2 offsets centre the glyph on the point we want it at.       */
function place(p, x, y, rot, scale) {
  p.el.style.transform =
    "translate3d(" + (x - p.size / 2).toFixed(1) + "px," +
    (y - p.size / 2).toFixed(1) + "px,0) rotate(" + rot.toFixed(1) +
    "deg) scale(" + scale.toFixed(3) + ")";
}

function buttonCenter() {
  const r = dom.magicBtn.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

function buildParticles() {
  const L = state.layout;
  const count = L.isSmall ? TUNING.heartsMobile : TUNING.heartsDesktop;
  const from = buttonCenter();
  const frag = document.createDocumentFragment();

  state.particles.length = 0;
  dom.stage.querySelectorAll(".particle").forEach((n) => n.remove());

  for (let i = 0; i < count; i++) {
    const size = rand(TUNING.particleSize[0], TUNING.particleSize[1]);
    const el = document.createElement("span");
    el.className = "particle";
    el.style.fontSize = size.toFixed(1) + "px";
    el.textContent = pick(TUNING.emojis);

    const sx = from.x + rand(-8, 8);          // launch point = the button
    const sy = from.y + rand(-8, 8);
    const slot = heartSlot(L.k, L.cx, L.cy);  // its home on the big heart

    /* random direction + distance for the "button dissolves" burst */
    const ang = rand(0, Math.PI * 2);
    const mag = rand(TUNING.burstSpeed[0], TUNING.burstSpeed[1]);
    const bvx = Math.cos(ang) * mag;
    const bvy = Math.sin(ang) * mag;

    /* the flight path is bowed sideways so it feels alive, not robotic */
    const ex = sx + bvx, ey = sy + bvy;
    const dx = slot.x - ex, dy = slot.y - ey;
    const len = Math.max(1, Math.hypot(dx, dy));
    const side = Math.random() < 0.5 ? -1 : 1;

    const p = {
      el, size, idx: i,
      sx, sy, bx: ex, by: ey,                 // start / burst-end position
      tx: slot.x, ty: slot.y,                 // target slot
      nx: (-dy / len) * side, ny: (dx / len) * side,
      side,                                    // remembered for re-aiming on resize
      curve: len * rand(TUNING.curveAmount[0], TUNING.curveAmount[1]),
      bvx, bvy,
      rot: rand(-150, 150), bRot: 0, tRot: rand(-28, 28), spin: rand(-1, 1),
      delay: i * TUNING.staggerMs + rand(0, TUNING.staggerJitterMs),
      dur: rand(TUNING.swarmMs[0], TUNING.swarmMs[1]),
      baseScale: rand(0.92, 1.08),
      amp: rand(TUNING.shimmerAmp[0], TUNING.shimmerAmp[1]),
      phase: rand(0, Math.PI * 2),
      live: false, settled: false
    };

    place(p, sx, sy, p.rot, 0.35);
    frag.appendChild(el);
    state.particles.push(p);
  }

  dom.stage.appendChild(frag);
  state.pending = count;
}
/* ------------------------------------------------------------
   ONE rAF loop drives the swarm AND the short-lived burst hearts
   ------------------------------------------------------------ */
function tick(now) {
  if (!state.running) return;
  state.frame++;
  if (!state.t0) state.t0 = now;
  const dtMs = Math.min(50, now - (state.lastNow || now));
  const dt = dtMs / 1000;
  state.lastNow = now;
  const parity = state.frame & 1;            // shimmer updates every 2nd frame

  const list = state.particles;
  for (let i = 0; i < list.length; i++) {
    const p = list[i];
    const local = now - state.t0 - p.delay;
    if (local < 0) continue;                 // still waiting for its turn

    if (!p.live) { p.live = true; p.el.classList.add("is-live"); }

    if (local < TUNING.burstMs) {
      /* --- phase 1: the button dissolves into an outward burst ------ */
      const e = easeOutCubic(local / TUNING.burstMs);
      p.x = p.sx + p.bvx * e;
      p.y = p.sy + p.bvy * e;
      p.bRot = p.rot + 190 * e * p.spin;
      place(p, p.x, p.y, p.bRot, 0.35 + 0.78 * e);
      continue;
    }

    if (!p.settled) {
      /* --- phase 2: ease into the assigned slot --------------------- */
      const k = Math.min(1, (local - TUNING.burstMs) / p.dur);
      const e = easeOutCubic(k);
      const bow = Math.sin(k * Math.PI) * p.curve;
      const x = p.bx + (p.tx - p.bx) * e + p.nx * bow;
      const y = p.by + (p.ty - p.by) * e + p.ny * bow;

      if (k >= 1) {                          // arrived -> settle for good
        p.settled = true;
        p.x = p.tx; p.y = p.ty;
        place(p, p.tx, p.ty, p.tRot, p.baseScale);
        if (--state.pending <= 0) onHeartFormed();
        continue;
      }
      /* a sideways bulge in scale makes the swarm feel springy */
      const bulge = 1 + 0.24 * Math.sin(k * Math.PI);
      p.x = x; p.y = y;
      place(p, x, y, p.bRot + (p.tRot - p.bRot) * e, p.baseScale * bulge);
      continue;
    }

    /* --- phase 3: settled -> soft shimmer (half the hearts per frame) - */
    if ((p.idx & 1) === parity) {
      const s = p.baseScale * (1 + p.amp * Math.sin(now * TUNING.shimmerSpeed + p.phase));
      place(p, p.tx, p.ty, p.tRot, s);
    }
  }

  /* --- short-lived burst hearts (cake blow-out) -------------------- */
  const free = state.freeHearts;
  for (let i = free.length - 1; i >= 0; i--) {
    const h = free[i];
    h.life += dtMs;
    if (h.life >= h.max) { h.el.remove(); free.splice(i, 1); continue; }
    h.vy += h.gravity * dt;
    h.vx *= 1 - 1.15 * dt;
    h.x += h.vx * dt;
    h.y += h.vy * dt;
    h.rot += h.spin * dt;
    const t = h.life / h.max;
    place(h, h.x, h.y, h.rot, h.baseScale * (1 - 0.3 * t));
    h.el.style.opacity = (1 - t * t).toFixed(3);
  }

  state.rafId = requestAnimationFrame(tick);
}

function startLoop() {
  if (state.running) return;
  state.running = true;
  state.frame = 0;
  state.t0 = 0;
  state.lastNow = 0;
  state.rafId = requestAnimationFrame(tick);
}
function stopLoop() {
  state.running = false;
  if (state.rafId) cancelAnimationFrame(state.rafId);
  state.rafId = 0;
}

/* hearts that fly out, arc and fade (used for the candle blow-out) */
function freeBurst(cx, cy, count) {
  const frag = document.createDocumentFragment();
  for (let i = 0; i < count; i++) {
    const size = rand(12, 22);
    const el = document.createElement("span");
    el.className = "particle is-live";
    el.style.fontSize = size.toFixed(1) + "px";
    el.textContent = pick(TUNING.emojis);
    const ang = rand(-Math.PI * 0.92, -Math.PI * 0.08);   // mostly upwards
    const spd = rand(150, 520);
    const h = {
      el, size,
      x: cx + rand(-6, 6), y: cy + rand(-6, 6),
      vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      rot: rand(-90, 90), spin: rand(-280, 280),
      life: 0, max: rand(900, 1700), gravity: 640,
      baseScale: rand(0.7, 1.2)
    };
    place(h, h.x, h.y, h.rot, h.baseScale);
    frag.appendChild(el);
    state.freeHearts.push(h);
  }
  dom.stage.appendChild(frag);
  startLoop();
}

/* small hearts orbiting the finished big heart (pure CSS animation) */
function buildOrbitHearts() {
  dom.orbit.innerHTML = "";
  if (state.reduceMotion) return;            // no motion => no orbiters
  const r = (state.layout.heartW * 0.62).toFixed(1) + "px";
  const frag = document.createDocumentFragment();
  for (let i = 0; i < TUNING.orbitHeartCount; i++) {
    const el = document.createElement("span");
    el.className = "orbit__item";
    el.textContent = pick(TUNING.emojis);
    el.style.fontSize = rand(12, 22).toFixed(1) + "px";
    el.style.setProperty("--a", ((i / TUNING.orbitHeartCount) * 360).toFixed(1) + "deg");
    el.style.setProperty("--r", r);
    el.style.animationDuration = rand(9, 18).toFixed(1) + "s";
    el.style.animationDelay = (-rand(0, 9)).toFixed(1) + "s";
    frag.appendChild(el);
  }
  dom.orbit.appendChild(frag);
}
/* ============================================================
   ✨  THE HEART IS COMPLETE -> glow, title, typewriter
   ============================================================ */
function onHeartFormed() {
  if (state.phase === "formed" || state.phase === "finale") return;
  state.phase = "formed";

  dom.heartGlow.classList.add("is-on");
  buildOrbitHearts();

  if (state.reduceMotion) {                  // reduced motion: instantly there
    revealTitle();
    later(startTypewriter, 250);
    return;
  }
  later(revealTitle, TUNING.titleDelayMs);
  later(startTypewriter,
        TUNING.titleDelayMs + 450 + TITLE_TEXT.length * TUNING.letterStaggerMs);
}

/* one character at a time, with a blinking cursor */
function startTypewriter() {
  const text = PERSONAL_MESSAGE;
  let i = 0;
  dom.typed.textContent = "";
  dom.caret.classList.remove("is-done");
  dom.msgWrap.classList.add("is-visible");

  if (state.reduceMotion) {                  // no typing animation
    dom.typed.textContent = text;
    dom.caret.classList.add("is-done");
    later(showFinale, 500);
    return;
  }

  (function step() {
    i++;
    dom.typed.textContent = text.slice(0, i);
    if (i < text.length) {
      later(step, TUNING.typeSpeedMs);
    } else {
      dom.caret.classList.add("is-done");
      later(showFinale, TUNING.finaleDelayMs);
    }
  })();
}

/* ============================================================
   🎬  SCENE 2 -> 3 : the click, the swarm, then the finale
   ============================================================ */
function startSwarm() {
  if (state.phase !== "idle") return;        // one click only
  state.phase = "swarm";

  dom.magicBtn.classList.add("is-dissolving");
  dom.scene1.classList.add("is-hidden");     // fades out (see CSS transition)

  if (state.reduceMotion) {
    /* reduced motion: no swarm, no burst — the heart simply IS there */
    buildParticles();
    const list = state.particles;
    for (let i = 0; i < list.length; i++) {
      const p = list[i];
      p.live = true; p.settled = true;
      p.el.classList.add("is-live");
      place(p, p.tx, p.ty, p.tRot, p.baseScale);
    }
    state.pending = 0;
    onHeartFormed();
    return;
  }

  buildParticles();
  startLoop();
}
/* ============================================================
   🎉  SCENE 3 — confetti, cake, wish, replay
   ============================================================ */
function showFinale() {
  if (state.phase === "finale") return;
  state.phase = "finale";
  startConfetti();
  dom.finale.classList.add("is-visible");
  dom.replay.classList.add("is-visible");
}

/* gently raining confetti hearts (CSS animation => zero JS per frame) */
function startConfetti() {
  if (state.confettiStarted) return;
  state.confettiStarted = true;
  if (state.reduceMotion) return;             // keep the screen still
  const frag = document.createDocumentFragment();
  for (let i = 0; i < TUNING.confettiCount; i++) {
    const el = document.createElement("span");
    el.className = "confetti";
    el.textContent = pick(TUNING.emojis);
    el.style.left = rand(-2, 100).toFixed(1) + "%";
    el.style.fontSize = rand(12, 26).toFixed(1) + "px";
    el.style.setProperty("--drift", rand(-90, 90).toFixed(0) + "px");
    el.style.setProperty("--o", rand(0.12, 0.32).toFixed(2));
    el.style.animationDuration = rand(9, 17).toFixed(1) + "s";
    el.style.animationDelay = (-rand(0, 17)).toFixed(1) + "s";   // already mid-air
    frag.appendChild(el);
  }
  dom.confetti.appendChild(frag);
}

/* the tiny hearts drifting around on the very first screen */
function buildFloatHearts() {
  if (state.reduceMotion) return;
  const frag = document.createDocumentFragment();
  for (let i = 0; i < TUNING.floatHeartCount; i++) {
    const el = document.createElement("span");
    el.className = "float-heart";
    el.textContent = pick(TUNING.emojis);
    el.style.left = rand(2, 96).toFixed(1) + "%";
    el.style.fontSize = rand(10, 24).toFixed(1) + "px";
    el.style.setProperty("--dx", rand(-70, 70).toFixed(0) + "px");
    el.style.setProperty("--o", rand(0.12, 0.34).toFixed(2));
    el.style.animationDuration = rand(13, 26).toFixed(1) + "s";
    el.style.animationDelay = (-rand(0, 26)).toFixed(1) + "s";
    frag.appendChild(el);
  }
  dom.scene1.appendChild(frag);
}

/* tapping the cake blows the candles out */
function blowCandles() {
  const r = dom.cake.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height * 0.22;
  const firstTime = !dom.cake.classList.contains("is-blown");

  if (firstTime) {
    dom.cake.classList.add("is-blown");       // flames die + smoke wisps rise
    later(() => dom.wish.classList.add("is-visible"), 420);
  }
  if (state.reduceMotion) return;             // no flying hearts
  freeBurst(cx, cy, firstTime ? TUNING.finalBurst : 24);
}

/* ============================================================
   ↺  REPLAY — wipe every scrap of state and start over
   (built to be tapped again and again)
   ============================================================ */
function replay() {
  clearTimers();
  stopLoop();

  state.phase = "idle";
  state.pending = 0;
  state.frame = 0;
  state.confettiStarted = false;
  state.particles.length = 0;
  state.freeHearts.length = 0;

  /* temporary nodes */
  dom.stage.querySelectorAll(".particle").forEach((n) => n.remove());
  dom.orbit.innerHTML = "";
  dom.confetti.innerHTML = "";
  dom.heartGlow.classList.remove("is-on");

  /* text */
  dom.titleText.classList.remove("is-revealing");
  buildTitle();                               // fresh letters, hidden again
  dom.titleWrap.classList.remove("is-visible");
  dom.msgWrap.classList.remove("is-visible");
  dom.typed.textContent = "";
  dom.caret.classList.remove("is-done");

  /* finale */
  dom.finale.classList.remove("is-visible");
  dom.cake.classList.remove("is-blown");
  dom.wish.classList.remove("is-visible");
  dom.replay.classList.remove("is-visible");

  /* scene 1 is back, ready for another click */
  dom.magicBtn.classList.remove("is-dissolving");
  dom.scene1.classList.remove("is-hidden");

  /* re-measure, in case the phone was rotated while it played */
  state.layout = measureLayout();
  applyLayout(state.layout);
}
/* ============================================================
   📱  RESIZE / ROTATE — re-measure and re-centre everything
   (debounced, so it never fights the 60fps loop)
   ============================================================ */
let resizeTimer = 0;
function onResize() {
  const L = measureLayout();
  state.layout = L;
  applyLayout(L);

  /* re-aim every flying/settled heart at the new layout */
  const list = state.particles;
  for (let i = 0; i < list.length; i++) {
    const p = list[i];
    const slot = heartSlot(L.k, L.cx, L.cy);
    p.tx = slot.x;
    p.ty = slot.y;
    const dx = p.tx - p.bx, dy = p.ty - p.by;
    const len = Math.max(1, Math.hypot(dx, dy));
    p.nx = (-dy / len) * p.side;
    p.ny = (dx / len) * p.side;
    p.curve = len * 0.12;
    if (p.settled) place(p, p.tx, p.ty, p.tRot, p.baseScale);
  }
}

/* ============================================================
   🚀  BOOT
   ============================================================ */
function boot() {
  /* build the title letters up-front so the layout can measure them */
  buildTitle();

  /* measure (with the message full-length) and place everything */
  dom.typed.textContent = "";
  state.layout = measureLayout();
  applyLayout(state.layout);

  buildFloatHearts();

  dom.magicBtn.addEventListener("click", startSwarm);
  dom.replay.addEventListener("click", replay);
  dom.cake.addEventListener("click", blowCandles);

  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(onResize, 160);
  });
  window.addEventListener("orientationchange", () => setTimeout(onResize, 280));

  /* web fonts change text metrics: re-measure once they are ready */
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
      state.layout = measureLayout();
      applyLayout(state.layout);
    });
  }
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
</script>
